[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "portfolio-support-copilot"
version = "0.1.0"
description = "Async customer-support copilot for a physical-media store"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arq==0.26.3",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "langgraph==0.3.34",
  "langgraph-checkpoint-postgres==2.0.21",
  "psycopg[binary,pool]==3.2.6",
  "pydantic==2.11.3",
  "pydantic-settings==2.8.1",
  "python-dotenv==1.1.0",
  "sqlparse==0.5.3",
  "uvicorn[standard]==0.34.1",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_copilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: requires the Docker Compose stack and an OpenRouter API key",
  "eval: calls OpenRouter and is skipped without OPENROUTER_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
